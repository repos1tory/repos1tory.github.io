name: Build iOS Node.js and Wrangler packages

on:
  workflow_dispatch:
    inputs:
      node_ref:
        description: "Upstream Node.js tag"
        required: true
        default: "v24.22.0"
      node_port_ref:
        description: "repos1tory/node-ios ref for the Node 22.19 port"
        required: true
        default: "main"
      package_revision:
        description: "Debian revision for nodejs (bump when iOS port patches change)"
        required: true
        default: "3"
      wrangler_revision:
        description: "Debian revision for wrangler-ios packaging changes"
        required: true
        default: "2"
      wrangler_version:
        description: "Cloudflare Wrangler npm version"
        required: true
        default: "4.151.0"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_REF: ${{ inputs.node_ref }}
      NODE_PORT_REF: ${{ inputs.node_port_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout maintained Node 22 iOS port
        if: ${{ env.NODE_REF == 'v22.19.0' }}
        uses: actions/checkout@v4
        with:
          repository: repos1tory/node-ios
          ref: ${{ env.NODE_PORT_REF }}
          path: node-ios-port
      - name: Check source patch anchors against upstream Node.js
        run: |
          git clone --depth 1 --branch "$NODE_REF" https://github.com/nodejs/node.git node-src
          if [ "$NODE_REF" = "v22.19.0" ]; then
            bash node-ios-port/scripts/ios-source-fixups.sh node-src
          else
            bash ports/nodejs-ios/ios-source-fixups.sh node-src
          fi
          git -C node-src diff --check

  build:
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 180
    env:
      NODE_REF: ${{ inputs.node_ref }}
      NODE_PORT_REF: ${{ inputs.node_port_ref }}
      WRANGLER_VERSION: ${{ inputs.wrangler_version }}
      IOS_MIN: "15.0"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout maintained Node 22 iOS port
        if: ${{ env.NODE_REF == 'v22.19.0' }}
        uses: actions/checkout@v4
        with:
          repository: repos1tory/node-ios
          ref: ${{ env.NODE_PORT_REF }}
          path: node-ios-port

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - name: Install build tools
        run: |
          set -euxo pipefail
          xcrun --sdk iphoneos --show-sdk-path
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list ccache >/dev/null 2>&1 || brew install ccache
          brew list dpkg >/dev/null 2>&1 || brew install dpkg

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: node-ios-${{ inputs.node_ref }}-${{ github.run_id }}
          restore-keys: |
            node-ios-${{ inputs.node_ref }}-
            node-ios-

      - name: Fetch upstream Node.js
        run: git clone --depth 1 --branch "$NODE_REF" https://github.com/nodejs/node.git node-src

      - name: Apply iOS port patches
        run: |
          if [ "$NODE_REF" = "v22.19.0" ]; then
            bash node-ios-port/scripts/ios-source-fixups.sh node-src
          else
            bash ports/nodejs-ios/ios-source-fixups.sh node-src
          fi

      - name: Configure iOS arm64 cross-build
        working-directory: node-src
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=4G
          export CC="ccache clang -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CXX="ccache clang++ -std=gnu++20 -arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export CC_host="ccache clang"
          export CXX_host="ccache clang++ -std=gnu++20"
          export LDFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=$IOS_MIN"
          export GYP_DEFINES="target_arch=arm64 host_arch=arm64 host_os=mac target_os=ios"
          python3 configure \
            --dest-os=ios --dest-cpu=arm64 --cross-compiling \
            --with-intl=small-icu \
            --without-node-snapshot --without-node-code-cache --without-inspector \
            --openssl-no-asm

      - name: Build Node.js
        working-directory: node-src
        run: |
          set -euxo pipefail
          export CCACHE_DIR="$HOME/.ccache"
          # V8 13 (Node 24) uses C++20 paren-init aggregates in headers included
          # by HOST TUs (e.g. deps/v8/src/wasm/value-type.h), but gyp-make only
          # sets -std=gnu++20 for the Linux/Android flavors and Apple clang
          # defaults to gnu++17 -- so host objects failed with
          # "no matching conversion ... to 'TypeIndex'". Force the standard on
          # both host and target compile lines (last -std wins).
          export CXXFLAGS="-std=gnu++20"
          export CXXFLAGS_host="-std=gnu++20"
          set +e
          make -j2 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -nE "error:|fatal error|Error [0-9]|ld: |Undefined symbols|clang: error" build.log \
              | grep -viE "no newline|Wnewline-eof|#warning|_GLIBCXX" | tail -60 || true
            exit "$rc"
          fi
          test -s out/Release/node

      - name: Save Node build cache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: node-ios-${{ inputs.node_ref }}-${{ github.run_id }}

      - name: Sign and inspect Node.js
        working-directory: node-src
        run: |
          set -euxo pipefail
          if [ "$NODE_REF" = "v22.19.0" ]; then
            ldid -S../node-ios-port/entitlements.plist out/Release/node
          else
            ldid -S../ports/nodejs-ios/entitlements.plist out/Release/node
          fi
          otool -l out/Release/node | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS"
          shasum -a 256 out/Release/node

      - name: Package Node.js and bundled npm
        run: |
          set -euxo pipefail
          version="${NODE_REF#v}"
          package_version="${version}-${{ inputs.package_revision }}"
          root="$RUNNER_TEMP/nodejs-pkg"
          mkdir -p "$root/DEBIAN" "$root/var/jb/usr/bin" "$root/var/jb/usr/lib/nodejs" "$root/var/jb/usr/lib/node_modules" "$root/var/jb/usr/share/doc/nodejs"
          cp node-src/out/Release/node "$root/var/jb/usr/lib/nodejs/node"
          cp -R node-src/deps/npm "$root/var/jb/usr/lib/node_modules/npm"
          cp node-src/LICENSE "$root/var/jb/usr/share/doc/nodejs/copyright"
          if [ "$NODE_REF" = "v22.19.0" ]; then
            cp node-ios-port/README.md "$root/var/jb/usr/share/doc/nodejs/README.port"
            cp node-ios-port/entitlements.plist "$RUNNER_TEMP/entitlements.plist"
          else
            cp ports/nodejs-ios/README.md "$root/var/jb/usr/share/doc/nodejs/README.port"
            cp ports/nodejs-ios/entitlements.plist "$RUNNER_TEMP/entitlements.plist"
          fi
          cp node-src/out/Release/node "$RUNNER_TEMP/node-${version}-iphoneos-arm64"
          cat > "$root/var/jb/usr/bin/node" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler "$@"
          EOF
          cat > "$root/var/jb/usr/bin/npm" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler /var/jb/usr/lib/node_modules/npm/bin/npm-cli.js "$@"
          EOF
          cat > "$root/var/jb/usr/bin/npx" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler /var/jb/usr/lib/node_modules/npm/bin/npx-cli.js "$@"
          EOF
          chmod 755 "$root/var/jb/usr/bin/node" "$root/var/jb/usr/bin/npm" "$root/var/jb/usr/bin/npx" "$root/var/jb/usr/lib/nodejs/node"
          cat > "$root/DEBIAN/control" <<EOF
          Package: nodejs
          Version: ${package_version}
          Architecture: iphoneos-arm64
          Maintainer: Alsinas Labs
          Section: Development
          Priority: optional
          Depends: firmware (>= 15.0)
          Description: Node.js ${version} runtime for jailbroken iOS arm64
           Experimental upstream Node.js port with W^X JIT support for iOS.
          EOF
          deb="$RUNNER_TEMP/nodejs_${package_version}_iphoneos-arm64.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          dpkg-deb -c "$deb" | grep -F './var/jb/usr/bin/node'
          if dpkg-deb -c "$deb" | grep -F './usr/bin/node'; then
            echo 'rootless node package unexpectedly contains /usr/bin/node' >&2
            exit 1
          fi

      - name: Upload Node.js artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-node-${{ env.NODE_REF }}-r${{ inputs.package_revision }}
          path: |
            ${{ runner.temp }}/nodejs_*.deb
            ${{ runner.temp }}/node-*-iphoneos-arm64
            ${{ runner.temp }}/entitlements.plist
          if-no-files-found: error
          retention-days: 14

      - name: Assemble Wrangler for iOS
        run: |
          set -euxo pipefail
          node_version="${NODE_REF#v}"
          wrangler_package_version="${WRANGLER_VERSION}-${{ inputs.wrangler_revision }}"
          install_root="$RUNNER_TEMP/wrangler-install"
          root="$RUNNER_TEMP/wrangler-pkg"
          mkdir -p "$install_root" "$root/DEBIAN" "$root/var/jb/usr/bin" "$root/var/jb/usr/lib"
          cp ports/wrangler/package.json ports/wrangler/package-lock.json "$install_root/"
          (cd "$install_root" && npm ci --omit=optional --ignore-scripts --no-audit --no-fund)
          node ports/wrangler/patch-ios-workerd.mjs "$install_root/node_modules"
          cp -R "$install_root/node_modules" "$root/var/jb/usr/lib/node_modules"
          cp ports/wrangler/workerd-ios-unavailable "$root/var/jb/usr/bin/workerd-ios-unavailable"
          cat > "$root/var/jb/usr/bin/wrangler" <<'EOF'
          #!/var/jb/bin/sh
          exec /var/jb/usr/lib/nodejs/node --predictable --single-threaded --disable-wasm-trap-handler /var/jb/usr/lib/node_modules/wrangler/bin/wrangler.js "$@"
          EOF
          chmod 755 "$root/var/jb/usr/bin/wrangler" "$root/var/jb/usr/bin/workerd-ios-unavailable"
          cat > "$root/DEBIAN/control" <<EOF
          Package: wrangler-ios
          Version: ${wrangler_package_version}
          Architecture: iphoneos-arm64
          Maintainer: Alsinas Labs
          Section: Development
          Priority: optional
          Depends: firmware (>= 15.0), nodejs (>= ${node_version})
          Description: Cloudflare Wrangler CLI for jailbroken iOS arm64
           API, authentication, and deployment CLI. Local wrangler dev is unavailable
           because Cloudflare workerd has no iOS runtime build.
          EOF
          deb="$RUNNER_TEMP/wrangler-ios_${wrangler_package_version}_iphoneos-arm64.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          dpkg-deb -c "$deb" | grep -F './var/jb/usr/bin/wrangler'
          if dpkg-deb -c "$deb" | grep -F './usr/bin/wrangler'; then
            echo 'rootless Wrangler package unexpectedly contains /usr/bin/wrangler' >&2
            exit 1
          fi

      - name: Smoke-test Wrangler package on build host
        run: |
          set -euxo pipefail
          modules="$RUNNER_TEMP/wrangler-pkg/var/jb/usr/lib/node_modules"
          node --check "$modules/wrangler/bin/wrangler.js"
          node -e 'const p=require("./ports/wrangler/package.json"); console.log("wrangler",p.dependencies.wrangler,"esbuild wasm",p.dependencies.esbuild)'
          node -e 'const e=require(process.argv[1]); e.transform("const x: number = 42", {loader:"ts"}).then(r=>{if(!r.code.includes("42"))process.exit(1); console.log("ESBUILD_WASM_OK")})' "$modules/esbuild/lib/main.js"
          node -e 'const entry=process.argv[1]; Object.defineProperty(process,"platform",{value:"ios"}); process.argv=[process.execPath,entry,"--version"]; require(entry)' "$modules/wrangler/bin/wrangler.js"
          fixture="$RUNNER_TEMP/wrangler-smoke"
          outdir="$RUNNER_TEMP/wrangler-smoke-output"
          mkdir -p "$fixture"
          cat > "$fixture/wrangler.toml" <<'EOF'
          name = "ios-port-smoke"
          main = "index.js"
          compatibility_date = "2026-10-12"
          EOF
          cat > "$fixture/index.js" <<'EOF'
          export default { fetch() { return new Response("ok"); } };
          EOF
          (cd "$fixture" && WRANGLER_HOME="$RUNNER_TEMP/wrangler-home" \
            node -e 'const entry=process.argv[1]; const args=process.argv.slice(2); Object.defineProperty(process,"platform",{value:"ios"}); process.argv=[process.execPath,entry,...args]; require(entry)' \
            "$modules/wrangler/bin/wrangler.js" deploy --dry-run --outdir "$outdir")
          echo "WRANGLER_DRY_RUN_OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-node-wrangler-packages
          path: |
            ${{ runner.temp }}/nodejs_*-iphoneos-arm64.deb
            ${{ runner.temp }}/wrangler-ios_*-iphoneos-arm64.deb
            ${{ runner.temp }}/node-*-iphoneos-arm64
            ${{ runner.temp }}/entitlements.plist
          if-no-files-found: error
          retention-days: 14
