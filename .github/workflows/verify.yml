name: verify APT metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify signatures, indexes and pool hashes
        run: sh scripts/verify-repo.sh

      - name: Verify with gpgv (APT's verifier)
        run: |
          gpgv --keyring docs/repos1tory.gpg docs/InRelease
          gpgv --keyring docs/repos1tory.gpg docs/Release.gpg docs/Release
